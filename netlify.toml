# Netlify continuous deploy for the Retroline Turbo SPA shell.
# Repo: https://github.com/NCSTATEPACK16/RetrolineTurbo
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the Netlify UI
# (Site settings → Environment variables). The anon key is public and safe:
# all data protection is enforced by Supabase Row-Level Security.

[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every path serves the app shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are immutable — cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry document must never be cached, so new deploys are picked up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
